[preset.0]
name="Windows Desktop"
platform="Windows Desktop"
runnable=true
export_filter="all_resources"
include_filter="*.json,*.mp4,*.txt"
exclude_filter="tests/*,tools/*"
export_path="bin/windows/StageForge.exe"

[preset.0.options]
binary_format/architecture="x86_64"
binary_format/embed_pck=false
application/modify_resources=false

[preset.1]
name="macOS"
platform="macOS"
runnable=true
export_filter="all_resources"
include_filter="*.json,*.mp4,*.txt"
exclude_filter="tests/*,tools/*"
export_path="bin/macos/StageForge.zip"

[preset.1.options]
binary_format/architecture="universal"
application/bundle_identifier="org.stageforge.rehearsal"
application/short_version="0.1.0"
application/version="0.1.0"
application/signature="SFRG"
codesign/codesign=1
